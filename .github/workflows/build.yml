name: Build FreeSO

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Cache Global NuGet Packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.nuget/packages
          ${{ github.workspace }}/TSOClient/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.sln', '**/*.config', '**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Generate MonoGame Projects via Protobuild
      shell: pwsh
      run: |
        Set-Location ./Other/libs/FSOMonoGame/
        ./protobuild.exe --generate
        Set-Location ../../../

    - name: Restore Solution NuGet Packages
      shell: pwsh
      run: |
        # Restoring at the solution level runs in parallel and avoids loop overhead
        nuget restore ./TSOClient/TSOClient.sln -NonInteractive

    - name: Build Submodules & Core Dependencies
      run: |
        msbuild ./Other/libs/Lidgren.Network/Lidgren.Network.csproj /p:Configuration=Release /p:Platform="AnyCPU" /m
        msbuild ./Other/libs/FSOMonoGame/MonoGame.Framework/MonoGame.Framework.WindowsGL.csproj /p:Configuration=Release /p:Platform="AnyCPU" /m

    - name: Build Client Project
      run: |
        msbuild ./TSOClient/FSO.IDE/FSO.IDE.csproj /p:Configuration=Release /p:Platform="AnyCPU" /m

    - name: Build Server Project
      run: |
        msbuild ./TSOClient/FSO.Server.Core/FSO.Server.Core.csproj /p:Configuration=Release /p:Platform="AnyCPU" /m

    - name: Stage Artifacts
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/artifacts/client"
        New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/artifacts/server"

        if (Test-Path "./TSOClient/FSO.IDE/bin/Release") {
          Copy-Item -Path "./TSOClient/FSO.IDE/bin/Release/*" -Destination "${{ github.workspace }}/artifacts/client/" -Recurse -Force
        }
        if (Test-Path "./TSOClient/FSO.Server.Core/bin/Release") {
          Copy-Item -Path "./TSOClient/FSO.Server.Core/bin/Release/*" -Destination "${{ github.workspace }}/artifacts/server/" -Recurse -Force
        }

    - name: Upload Client Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FreeSOClient
        path: ${{ github.workspace }}/artifacts/client/

    - name: Upload Server Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FreeSOServer
        path: ${{ github.workspace }}/artifacts/server/
