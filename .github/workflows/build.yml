name: Build FreeSO

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0 # Fetch history so change detection works accurately

    - name: Check Changed Files
      id: changed-files
      uses: tj-actions/changed-files@v45
      with:
        files_yaml: |
          client:
            - 'TSOClient/FSO.IDE/**'
            - 'TSOClient/FSO.Windows/**'
          server:
            - 'TSOClient/FSO.Server**'
          shared:
            - 'Other/libs/**'
            - 'TSOClient/FSO.Common/**'
            - 'TSOClient/FSO.SimAntics/**'
            - 'TSOClient/FSO.Files/**'
            - 'TSOClient/FSO.Vitaboy/**'
            - 'TSOClient/FSO.LotView/**'
            - '.github/workflows/build.yml'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Cache Global NuGet Packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.nuget/packages
          ${{ github.workspace }}/TSOClient/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.config', '**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Cache Legacy Reference Assemblies
      id: cache-ref-asms
      uses: actions/cache@v4
      with:
        path: C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework
        key: ${{ runner.os }}-ref-asms-net45-net461

    - name: Provision Legacy Reference Assemblies
      if: steps.cache-ref-asms.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        nuget install Microsoft.NETFramework.ReferenceAssemblies.net45 -Version 1.0.3 -OutputDirectory "$env:RUNNER_TEMP\ref_asms"
        nuget install Microsoft.NETFramework.ReferenceAssemblies.net461 -Version 1.0.3 -OutputDirectory "$env:RUNNER_TEMP\ref_asms"
        
        $net45Path = "$env:RUNNER_TEMP\ref_asms\Microsoft.NETFramework.ReferenceAssemblies.net45.1.0.3\build\.NETFramework\v4.5"
        $net461Path = "$env:RUNNER_TEMP\ref_asms\Microsoft.NETFramework.ReferenceAssemblies.net461.1.0.3\build\.NETFramework\v4.6.1"
        
        $sysDir = "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework"
        
        New-Item -ItemType Directory -Force -Path "$sysDir\v4.5"
        New-Item -ItemType Directory -Force -Path "$sysDir\v4.6.1"
        
        Copy-Item -Path "$net45Path\*" -Destination "$sysDir\v4.5\" -Recurse -Force
        Copy-Item -Path "$net461Path\*" -Destination "$sysDir\v4.6.1\" -Recurse -Force

    - name: Generate MonoGame Projects via Protobuild
      shell: pwsh
      run: |
        cd ./Other/libs/FSOMonoGame/
        ./protobuild.exe --generate
        cd ../../../

    - name: Restore Roslyn SDK Project
      run: dotnet restore ./TSOClient/FSO.SimAntics.JIT.Roslyn/FSO.SimAntics.JIT.Roslyn.csproj

    - name: Build Submodules & Core Dependencies
      run: |
        msbuild ./Other/libs/Lidgren.Network/Lidgren.Network.csproj /p:Configuration=Release /p:Platform="AnyCPU" /m /v:m
        msbuild ./Other/libs/FSOMonoGame/MonoGame.Framework/MonoGame.Framework.WindowsGL.csproj /p:Configuration=Release /p:Platform="AnyCPU" /m /v:m

    - name: Build Client Project
      if: |
        steps.changed-files.outputs.client_any_changed == 'true' || 
        steps.changed-files.outputs.shared_any_changed == 'true' ||
        github.event_name == 'workflow_dispatch'
      run: |
        msbuild ./TSOClient/FSO.IDE/FSO.IDE.csproj /restore /p:Configuration=Release /p:Platform="AnyCPU" /m /v:m

    - name: Build Server Project
      if: |
        steps.changed-files.outputs.server_any_changed == 'true' || 
        steps.changed-files.outputs.shared_any_changed == 'true' ||
        github.event_name == 'workflow_dispatch'
      run: |
        msbuild ./TSOClient/FSO.Server.Core/FSO.Server.Core.csproj /restore /p:Configuration=Release /p:Platform="AnyCPU" /m /v:m

    - name: Upload Client Artifacts
      if: |
        (steps.changed-files.outputs.client_any_changed == 'true' || 
         steps.changed-files.outputs.shared_any_changed == 'true' ||
         github.event_name == 'workflow_dispatch') && success()
      uses: actions/upload-artifact@v4
      with:
        name: FreeSOClient
        path: ./TSOClient/FSO.IDE/bin/Release/

    - name: Upload Server Artifacts
      if: |
        (steps.changed-files.outputs.server_any_changed == 'true' || 
         steps.changed-files.outputs.shared_any_changed == 'true' ||
         github.event_name == 'workflow_dispatch') && success()
      uses: actions/upload-artifact@v4
      with:
        name: FreeSOServer
        path: ./TSOClient/FSO.Server.Core/bin/Release/
