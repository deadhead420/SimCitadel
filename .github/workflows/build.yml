name: Build FreeSO

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Global Setup Legacy .NET Reference Assemblies
      shell: pwsh
      run: |
        $nugetUrl = "https://www.nuget.org/api/v2/package/Microsoft.NETFramework.ReferenceAssemblies/1.0.3"
        $zipPath = "$env:TEMP\net_ref.zip"
        $extractPath = "$env:TEMP\net_ref_extracted"

        Invoke-WebRequest -Uri $nugetUrl -OutFile $zipPath
        Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force

        # Extract nested packages for all .NET 4.x targets (4.5, 4.6.1, etc.)
        Get-ChildItem -Path "$extractPath\build" -Filter "*.nupkg" -Recurse | ForEach-Object {
          Expand-Archive -Path $_.FullName -DestinationPath "$extractPath\unpacked" -Force
        }

        $targetPaths = @(
          "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework",
          "C:\Program Files\Reference Assemblies\Microsoft\Framework\.NETFramework"
        )

        foreach ($target in $targetPaths) {
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Path "$extractPath\unpacked\build\.NETFramework\*" -Destination $target -Recurse -Force
        }

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Run Protobuild
      shell: pwsh
      run: |
        cd ./Other/libs/FSOMonoGame/
        ./protobuild.exe --generate
        cd ../../../
      continue-on-error: true

    - name: Restore Roslyn Core
      shell: pwsh
      run: |
        cd ./TSOClient/FSO.SimAntics.JIT.Roslyn/
        dotnet restore
        cd ../../
      continue-on-error: true

    - name: Restore Solution NuGet Packages
      run: nuget restore ./TSOClient/FreeSO.sln

    - name: Build Client
      run: |
        msbuild ./TSOClient/FreeSO.sln /t:FSO_IDE /p:Configuration=Release /p:Platform="Any CPU" /p:OutDir="${{ github.workspace }}/artifacts/client/"

    - name: Build Server
      run: |
        msbuild ./TSOClient/FreeSO.sln /t:FSO_Server_Core:Publish /p:Configuration=Release /p:Platform="Any CPU" /p:OutDir="${{ github.workspace }}/artifacts/server/"

    - name: Upload Client Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FreeSOClient
        path: ${{ github.workspace }}/artifacts/client/

    - name: Upload Server Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FreeSOServer
        path: ${{ github.workspace }}/artifacts/server/
