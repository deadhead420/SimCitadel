name: Build FreeSO

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Cache Global NuGet Packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.nuget/packages
          ${{ github.workspace }}/TSOClient/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.sln', '**/*.config', '**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Provision Legacy Reference Assemblies
      shell: pwsh
      run: |
        nuget install Microsoft.NETFramework.ReferenceAssemblies.net45 -Version 1.0.3 -OutputDirectory "$env:RUNNER_TEMP\ref_asms"
        nuget install Microsoft.NETFramework.ReferenceAssemblies.net461 -Version 1.0.3 -OutputDirectory "$env:RUNNER_TEMP\ref_asms"
        
        $net45Path = "$env:RUNNER_TEMP\ref_asms\Microsoft.NETFramework.ReferenceAssemblies.net45.1.0.3\build\.NETFramework\v4.5"
        $net461Path = "$env:RUNNER_TEMP\ref_asms\Microsoft.NETFramework.ReferenceAssemblies.net461.1.0.3\build\.NETFramework\v4.6.1"
        
        $sysDir = "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework"
        
        New-Item -ItemType Directory -Force -Path "$sysDir\v4.5"
        New-Item -ItemType Directory -Force -Path "$sysDir\v4.6.1"
        
        Copy-Item -Path "$net45Path\*" -Destination "$sysDir\v4.5\" -Recurse -Force
        Copy-Item -Path "$net461Path\*" -Destination "$sysDir\v4.6.1\" -Recurse -Force

    - name: Generate MonoGame Projects via Protobuild
      shell: pwsh
      run: |
        Set-Location ./Other/libs/FSOMonoGame/
        ./protobuild.exe --generate
        Set-Location ../../../

    - name: Restore NuGet Packages
      shell: pwsh
      run: |
        # 1. Restore modern SDK-style projects via dotnet (generates project.assets.json)
        dotnet restore ./TSOClient/FSO.SimAntics.JIT.Roslyn/FSO.SimAntics.JIT.Roslyn.csproj

        # 2. Restore legacy packages across the solution using solution-level NuGet restore
        nuget restore ./TSOClient/FreeSO.sln -NonInteractive -Verbosity quiet

        # 3. Restore any standalone submodule config files
        if (Test-Path "./Other/libs/Lidgren.Network/packages.config") {
          nuget restore ./Other/libs/Lidgren.Network/packages.config -SolutionDirectory ./Other/libs/Lidgren.Network -NonInteractive -Verbosity quiet
        }

    - name: Build Submodules & Core Dependencies
      run: |
        msbuild ./Other/libs/Lidgren.Network/Lidgren.Network.csproj /p:Configuration=Release /p:Platform="AnyCPU" /m /v:m
        msbuild ./Other/libs/FSOMonoGame/MonoGame.Framework/MonoGame.Framework.WindowsGL.csproj /p:Configuration=Release /p:Platform="AnyCPU" /m /v:m

    - name: Build Client Project
      run: |
        msbuild ./TSOClient/FSO.IDE/FSO.IDE.csproj /p:Configuration=Release /p:Platform="AnyCPU" /m /v:m

    - name: Build Server Project
      run: |
        msbuild ./TSOClient/FSO.Server.Core/FSO.Server.Core.csproj /p:Configuration=Release /p:Platform="AnyCPU" /m /v:m

    - name: Stage Artifacts
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/artifacts/client"
        New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/artifacts/server"

        if (Test-Path "./TSOClient/FSO.IDE/bin/Release") {
          Copy-Item -Path "./TSOClient/FSO.IDE/bin/Release/*" -Destination "${{ github.workspace }}/artifacts/client/" -Recurse -Force
        }
        if (Test-Path "./TSOClient/FSO.Server.Core/bin/Release") {
          Copy-Item -Path "./TSOClient/FSO.Server.Core/bin/Release/*" -Destination "${{ github.workspace }}/artifacts/server/" -Recurse -Force
        }

    - name: Upload Client Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FreeSOClient
        path: ${{ github.workspace }}/artifacts/client/

    - name: Upload Server Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FreeSOServer
        path: ${{ github.workspace }}/artifacts/server/
