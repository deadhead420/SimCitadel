name: Build FreeSO

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Provision Legacy Reference Assemblies
      shell: pwsh
      run: |
        nuget install Microsoft.NETFramework.ReferenceAssemblies.net45 -Version 1.0.3 -OutputDirectory "$env:RUNNER_TEMP\ref_asms"
        nuget install Microsoft.NETFramework.ReferenceAssemblies.net461 -Version 1.0.3 -OutputDirectory "$env:RUNNER_TEMP\ref_asms"
        
        $net45Path = "$env:RUNNER_TEMP\ref_asms\Microsoft.NETFramework.ReferenceAssemblies.net45.1.0.3\build\.NETFramework\v4.5"
        $net461Path = "$env:RUNNER_TEMP\ref_asms\Microsoft.NETFramework.ReferenceAssemblies.net461.1.0.3\build\.NETFramework\v4.6.1"
        
        $sysDir = "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework"
        
        New-Item -ItemType Directory -Force -Path "$sysDir\v4.5"
        New-Item -ItemType Directory -Force -Path "$sysDir\v4.6.1"
        
        Copy-Item -Path "$net45Path\*" -Destination "$sysDir\v4.5\" -Recurse -Force
        Copy-Item -Path "$net461Path\*" -Destination "$sysDir\v4.6.1\" -Recurse -Force

    - name: Run Protobuild
      shell: pwsh
      run: |
        cd ./Other/libs/FSOMonoGame/
        ./protobuild.exe --generate
        cd ../../../
      continue-on-error: true

    - name: Restore Roslyn Core
      shell: pwsh
      run: |
        cd ./TSOClient/FSO.SimAntics.JIT.Roslyn/
        dotnet restore
        cd ../../
      continue-on-error: true

    - name: Restore Solution NuGet Packages
      run: nuget restore ./TSOClient/FreeSO.sln

    - name: Build Client Target
      run: |
        msbuild ./TSOClient/FreeSO.sln /t:FSO_IDE /p:Configuration=Release /p:Platform="Any CPU"

    - name: Build Server Target
      run: |
        msbuild ./TSOClient/FreeSO.sln /t:FSO_Server_Core /p:Configuration=Release /p:Platform="Any CPU"

    - name: Stage Artifacts
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/artifacts/client"
        New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/artifacts/server"

        if (Test-Path "./TSOClient/FSO.IDE/bin/Release") {
          Copy-Item -Path "./TSOClient/FSO.IDE/bin/Release/*" -Destination "${{ github.workspace }}/artifacts/client/" -Recurse -Force
        }
        if (Test-Path "./TSOClient/FSO.Server.Core/bin/Release") {
          Copy-Item -Path "./TSOClient/FSO.Server.Core/bin/Release/*" -Destination "${{ github.workspace }}/artifacts/server/" -Recurse -Force
        }

    - name: Upload Client Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FreeSOClient
        path: ${{ github.workspace }}/artifacts/client/

    - name: Upload Server Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FreeSOServer
        path: ${{ github.workspace }}/artifacts/server/
